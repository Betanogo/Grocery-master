<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>오늘 뭐 사지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2F6B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="장보기">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#F2F5F1; --surface:#FFFFFF; --surface-sunken:#E9EFE8;
    --text:#1C2620; --text-soft:#5B6960; --text-faint:#93A199;
    --border:#DCE4DA; --accent:#2F6B47; --accent-soft:#DCEBE1;
    --accent-2:#E07A2C; --accent-2-soft:#FBE6D3; --done:#AEB8AF;
    --radius-s:10px; --radius-m:16px; --radius-l:22px;
    --shadow-card: 0 1px 2px rgba(28,38,32,0.06), 0 2px 12px rgba(28,38,32,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F; --surface:#1B221A; --surface-sunken:#212A1F;
      --text:#EDF1EA; --text-soft:#A7B4A4; --text-faint:#6C776A;
      --border:#2B342A; --accent:#6BC28C; --accent-soft:#223A2A;
      --accent-2:#F0965A; --accent-2-soft:#3A2A1B; --done:#4B564A;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 2px 14px rgba(0,0,0,0.28);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F; --surface:#1B221A; --surface-sunken:#212A1F;
    --text:#EDF1EA; --text-soft:#A7B4A4; --text-faint:#6C776A;
    --border:#2B342A; --accent:#6BC28C; --accent-soft:#223A2A;
    --accent-2:#F0965A; --accent-2-soft:#3A2A1B; --done:#4B564A;
    --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 2px 14px rgba(0,0,0,0.28);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Roboto','IBM Plex Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  button, input, textarea{ font-family:inherit; }

  .app{
    max-width:480px; margin:0 auto; min-height:100dvh;
    background:var(--bg); display:flex; flex-direction:column; position:relative;
  }

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:0; z-index:30; background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  header.top.scrolled{ border-bottom-color:var(--border); }

  .title-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .title-row h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:-0.2px; }
  .title-row .right-meta{ display:flex; align-items:center; gap:10px; }
  .title-row .sub{ font-size:12.5px; color:var(--text-soft); font-weight:500; white-space:nowrap; }

  .history-btn{
    flex:none; width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-soft); cursor:pointer; position:relative;
  }
  .history-btn .dotnew{
    position:absolute; top:-2px; right:-2px; width:9px; height:9px; border-radius:50%;
    background:var(--accent-2); border:2px solid var(--bg); display:none;
  }
  .history-btn.has-new .dotnew{ display:block; }

  .search-row{ display:flex; align-items:center; gap:8px; }
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1.5px solid var(--border);
    border-radius:999px; padding:0 14px; height:46px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .search-box svg{ flex:none; color:var(--text-faint); }
  .search-box input{ flex:1; border:none; outline:none; background:transparent; font-size:15.5px; color:var(--text); min-width:0; height:100%; }
  .search-box input::placeholder{ color:var(--text-faint); }
  .search-box .clear-btn{ flex:none; border:none; background:none; color:var(--text-faint); padding:4px; cursor:pointer; display:flex; }

  .icon-btn{
    flex:none; width:46px; height:46px; border-radius:50%;
    border:1.5px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-soft); cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .icon-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .tab-bar{ display:flex; gap:8px; margin-top:10px; }
  .tab-btn{
    flex:1; height:38px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text-soft); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .tab-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .list-search-panel{ overflow:hidden; max-height:0; transition:max-height .22s ease; }
  .list-search-panel.open{ max-height:60px; margin-top:8px; }
  .list-search-panel input{
    width:100%; height:40px; border-radius:999px; border:1.5px solid var(--accent);
    padding:0 14px; font-size:14.5px; background:var(--accent-soft); color:var(--text); outline:none;
  }

  /* ---------- catalog dropdown ---------- */
  .catalog-panel{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    margin-top:10px; box-shadow:var(--shadow-card); overflow:hidden;
  }
  .catalog-list{ max-height:52vh; overflow-y:auto; }
  .catalog-row{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--border); }
  .catalog-row:last-child{ border-bottom:none; }
  .catalog-row .names{ flex:1; min-width:0; }
  .catalog-row .name-ko{ font-size:15px; font-weight:500; }
  .catalog-row .name-en{ font-size:12px; color:var(--text-faint); margin-top:1px; }

  .plus-btn{
    flex:none; width:32px; height:32px; border-radius:50%; border:none;
    background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .plus-btn:active{ transform:scale(0.9); }
  .plus-btn.rotate{ background:var(--accent); color:#fff; transform:rotate(45deg); }

  .add-custom-btn{
    display:flex; align-items:center; gap:10px; width:100%; padding:13px 14px;
    background:var(--accent-2-soft); border:none; border-top:1px solid var(--border);
    cursor:pointer; text-align:left;
  }
  .add-custom-btn .plus-btn{ background:var(--accent-2); color:#fff; }
  .add-custom-btn .txt{ font-size:14.5px; font-weight:500; color:var(--accent-2); }
  .add-custom-btn .txt b{ font-weight:700; }

  .empty-search{ padding:22px 14px; text-align:center; color:var(--text-faint); font-size:13.5px; }

  /* ---------- qty sheet ---------- */
  .qty-sheet{ padding:12px 14px 14px; background:var(--surface-sunken); border-top:1px solid var(--border); }
  .qty-sheet .row1{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .qty-stepper{
    display:flex; align-items:center; background:var(--surface); border:1.5px solid var(--border);
    border-radius:999px; overflow:hidden; flex:none;
  }
  .qty-stepper button{ width:34px; height:34px; border:none; background:transparent; color:var(--accent); font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qty-stepper input{ width:42px; text-align:center; border:none; background:transparent; outline:none; font-size:15px; font-weight:600; color:var(--text); -moz-appearance:textfield; }
  .qty-stepper input::-webkit-outer-spin-button, .qty-stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .unit-chips{ display:flex; gap:6px; flex:1; flex-wrap:wrap; }
  .unit-chip{ padding:7px 13px; border-radius:999px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-soft); font-size:13.5px; font-weight:500; cursor:pointer; }
  .unit-chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .loc-row{ margin-top:10px; }
  .loc-input{
    width:100%; height:38px; border:1.5px solid var(--border); border-radius:999px;
    padding:0 14px; font-size:13.5px; background:var(--surface); color:var(--text); outline:none;
  }
  .loc-input:focus{ border-color:var(--accent); }
  .dup-warning{
    background:var(--accent-2-soft); border:1px solid var(--accent-2); color:var(--accent-2);
    border-radius:var(--radius-s); padding:8px 12px; font-size:12.5px; font-weight:600; margin-bottom:10px;
  }
  .catalog-row .already-tag{
    display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:1px 8px; vertical-align:middle;
  }
  .loc-tag{
    display:inline-block; margin-top:2px; font-size:11px; font-weight:600; color:var(--accent);
    background:var(--accent-soft); border-radius:999px; padding:2px 9px;
  }
  .item-note{
    font-size:11.5px; color:var(--text-faint); margin-top:2px; font-style:italic;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px;
  }
  .photo-indicator{ font-size:11px; margin-left:4px; }

  /* ---------- pantry detail overlay ---------- */
  .detail-backdrop{
    position:fixed; inset:0; background:rgba(10,14,10,0.45); z-index:58;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .detail-backdrop.open{ opacity:1; pointer-events:auto; }
  .detail-sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:59;
    max-width:480px; margin:0 auto;
    background:var(--surface); border-radius:22px 22px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,0.18);
    max-height:88dvh; overflow-y:auto;
    transform:translateY(100%); transition:transform .25s ease;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .detail-sheet.open{ transform:translateY(0); }
  .detail-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 4px; }
  .detail-head h3{ margin:0; font-size:17px; font-weight:700; }
  .detail-close{ border:none; background:var(--surface-sunken); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-soft); cursor:pointer; }
  .detail-body{ padding:10px 18px 20px; }
  .detail-photo-area{
    width:100%; aspect-ratio:16/10; border-radius:var(--radius-m); overflow:hidden;
    background:var(--surface-sunken); display:flex; align-items:center; justify-content:center;
    margin-bottom:10px; position:relative;
  }
  .detail-photo-area img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-photo-placeholder{ color:var(--text-faint); font-size:13px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .photo-btn-row{ display:flex; gap:8px; margin-bottom:16px; }
  .photo-btn{
    flex:1; height:38px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text-soft); font-size:13px; font-weight:600; cursor:pointer;
  }
  .photo-btn.remove{ color:var(--accent-2); border-color:var(--accent-2); flex:0 0 auto; padding:0 16px; }
  .detail-field-label{ font-size:11.5px; font-weight:600; color:var(--text-faint); margin:14px 2px 6px; }
  .detail-field-label:first-of-type{ margin-top:0; }
  .cat-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .detail-note-input{
    width:100%; min-height:64px; border:1.5px solid var(--border); border-radius:var(--radius-s);
    padding:10px 12px; font-size:13.5px; font-family:inherit; resize:vertical; outline:none;
    color:var(--text); background:var(--surface);
  }
  .detail-note-input:focus{ border-color:var(--accent); }
  .detail-actions{ display:flex; gap:8px; margin-top:18px; }
  .detail-delete-btn{
    flex:none; height:44px; padding:0 16px; border-radius:999px; border:1.5px solid var(--accent-2);
    background:var(--accent-2-soft); color:var(--accent-2); font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .detail-save-btn{
    flex:1; height:44px; border:none; border-radius:999px; background:var(--accent);
    color:#fff; font-size:14px; font-weight:700; cursor:pointer;
  }

  .selection-bar{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    max-width:448px; width:calc(100% - 32px); background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-l); padding:10px 12px;
    display:none; align-items:center; gap:6px; box-shadow:var(--shadow-card); z-index:41;
  }
  .selection-bar.show{ display:flex; }
  .selection-bar .sel-count{ font-size:12.5px; font-weight:700; color:var(--text); flex:1; padding-left:4px; }
  .selection-bar button{
    height:36px; padding:0 12px; border-radius:999px; border:1.5px solid var(--border);
    background:var(--surface); color:var(--text-soft); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .selection-bar button.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .selection-bar button.cancel{ color:var(--accent-2); border-color:var(--accent-2); }

  .select-checkbox{
    flex:none; width:22px; height:22px; border-radius:6px;
    border:2px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .select-checkbox.checked{ background:var(--accent); border-color:var(--accent); }
  .select-checkbox svg{ opacity:0; transform:scale(0.5); transition:opacity .12s ease, transform .12s ease; }
  .select-checkbox.checked svg{ opacity:1; transform:scale(1); }
  .qty-sheet .row2{ display:flex; gap:8px; }
  .confirm-add-btn{ flex:1; height:38px; border:none; border-radius:999px; background:var(--accent); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer; }
  .cancel-add-btn{ height:38px; padding:0 16px; border:1.5px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text-soft); font-size:14px; font-weight:500; cursor:pointer; }

  /* ---------- main ---------- */
  main{ flex:1; padding:14px 16px 100px; }

  .summary-card{ display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow-card); }
  .ring-wrap{ position:relative; flex:none; width:52px; height:52px; }
  .ring{ position:absolute; inset:0; border-radius:50%; background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-sunken) 0); }
  .ring::after{ content:''; position:absolute; inset:6px; border-radius:50%; background:var(--surface); }
  .summary-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--accent); }
  .summary-copy{ flex:1; }
  .summary-copy .headline{ font-size:15px; font-weight:600; }
  .summary-copy .sub{ font-size:12.5px; color:var(--text-soft); margin-top:2px; }

  .section-label{ font-size:12.5px; font-weight:600; color:var(--text-faint); margin:18px 2px 8px; display:flex; align-items:center; justify-content:space-between; }
  .cat-label{ font-size:11.5px; font-weight:700; color:var(--accent); margin:16px 4px 6px; letter-spacing:0.2px; }
  .cat-label:first-child{ margin-top:4px; }

  .clear-list-btn{
    display:block; width:100%; margin-top:10px; height:44px; border-radius:999px;
    border:1.5px solid var(--border); background:var(--surface); color:var(--text-soft);
    font-size:14px; font-weight:600; cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  .clear-list-btn.all-done{ background:var(--accent-2-soft); border-color:var(--accent-2); color:var(--accent-2); }
  .confirm-clear{ display:flex; align-items:center; gap:8px; margin-top:10px; background:var(--accent-2-soft); border:1.5px solid var(--accent-2); border-radius:var(--radius-l); padding:12px 14px; }
  .confirm-clear span{ flex:1; font-size:13.5px; font-weight:600; color:var(--text); }
  .confirm-clear button{ border:none; border-radius:999px; height:34px; padding:0 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .confirm-clear .yes-btn{ background:var(--accent-2); color:#fff; }
  .confirm-clear .no-btn{ background:var(--surface); color:var(--text-soft); border:1.5px solid var(--border); }

  .list-group{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); overflow:hidden; box-shadow:var(--shadow-card); }
  .item-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); transition:background .15s ease; }
  .item-row:last-child{ border-bottom:none; }
  .checkbox{ flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .15s ease, border-color .15s ease; }
  .checkbox.checked{ background:var(--accent); border-color:var(--accent); }
  .checkbox svg{ opacity:0; transform:scale(0.5); transition:opacity .12s ease, transform .12s ease; }
  .checkbox.checked svg{ opacity:1; transform:scale(1); }
  .item-body{ flex:1; min-width:0; cursor:pointer; }
  .item-name{ font-size:15px; font-weight:500; color:var(--text); }
  .item-qty{ font-size:12.5px; color:var(--text-soft); margin-top:1px; }
  .item-row.done .item-name{ color:var(--done); text-decoration:line-through; text-decoration-thickness:1.3px; }
  .item-row.done .item-qty{ color:var(--done); }
  .item-row.done .item-body{ opacity:0.75; }
  .del-btn{ flex:none; border:none; background:none; color:var(--text-faint); width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:50%; opacity:0.6; }
  .del-btn:active{ background:var(--surface-sunken); opacity:1; }
  .edit-btn{ flex:none; border:none; background:none; color:var(--text-faint); width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:50%; opacity:0.6; }
  .edit-btn:active{ background:var(--surface-sunken); opacity:1; }
  .item-edit-panel{ background:var(--surface-sunken); padding:12px 16px 14px; border-bottom:1px solid var(--border); }

  .empty-state{ text-align:center; padding:54px 24px 30px; color:var(--text-soft); }
  .empty-state .emoji{ font-size:38px; margin-bottom:10px; }
  .empty-state h2{ font-size:16.5px; font-weight:600; color:var(--text); margin:0 0 6px; }
  .empty-state p{ font-size:13.5px; line-height:1.5; margin:0; color:var(--text-soft); }

  .sync-pill{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    max-width:448px; width:calc(100% - 32px); background:var(--text); color:var(--bg);
    border-radius:999px; padding:9px 16px; font-size:12.5px; font-weight:500;
    display:flex; align-items:center; gap:8px; justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.18); opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:40;
  }
  .sync-pill.show{ opacity:0.94; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none; }

  .install-banner{
    display:none; align-items:center; gap:10px;
    background:var(--accent-soft); border:1px solid var(--accent);
    border-radius:var(--radius-m); padding:10px 14px; margin:0 16px 10px;
    font-size:12.8px; color:var(--text); line-height:1.4;
  }
  .install-cta{
    flex:none; border:none; border-radius:999px; height:30px; padding:0 14px;
    background:var(--accent); color:#fff; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .install-dismiss{
    flex:none; border:none; background:none; color:var(--text-soft);
    width:24px; height:24px; cursor:pointer; font-size:13px;
  }

  /* ---------- history drawer ---------- */
  .history-backdrop{
    position:fixed; inset:0; background:rgba(10,14,10,0.4); z-index:48;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .history-backdrop.open{ opacity:1; pointer-events:auto; }
  .history-drawer{
    position:fixed; top:0; right:0; height:100dvh; width:86%; max-width:360px;
    background:var(--surface); z-index:49; box-shadow:-8px 0 30px rgba(0,0,0,0.15);
    transform:translateX(100%); transition:transform .25s ease;
    display:flex; flex-direction:column;
  }
  .history-drawer.open{ transform:translateX(0); }
  .history-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }

  .history-close{ border:none; background:var(--surface-sunken); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-soft); cursor:pointer; }
  .history-body{ flex:1; overflow-y:auto; padding:6px 0; }
  .history-row{ display:flex; align-items:baseline; gap:8px; padding:11px 18px; border-bottom:1px solid var(--border); }
  .history-row .h-who{ font-weight:700; font-size:13.5px; color:var(--accent); flex:none; }
  .history-row .h-action{ flex:1; font-size:13.5px; color:var(--text); min-width:0; }
  .history-row .h-time{ font-size:11.5px; color:var(--text-faint); flex:none; }

  /* ---------- setup overlay ---------- */
  .setup-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:20px;
    overflow-y:auto;
  }
  .setup-card{ width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-l); padding:24px 22px; box-shadow:var(--shadow-card); }
  .setup-card h2{ font-size:18px; margin:0 0 6px; }
  .setup-card p{ font-size:13.5px; color:var(--text-soft); line-height:1.6; margin:0 0 14px; }
  .setup-steps{ background:var(--surface-sunken); border-radius:var(--radius-m); padding:14px 16px; font-size:12.8px; color:var(--text-soft); line-height:1.7; margin-bottom:16px; }
  .setup-steps b{ color:var(--text); }
  .setup-card textarea{
    width:100%; min-height:110px; border:1.5px solid var(--border); border-radius:var(--radius-s);
    padding:10px 12px; font-size:12.5px; font-family:monospace; resize:vertical; outline:none; color:var(--text); background:var(--surface);
  }
  .setup-card textarea:focus, .setup-card input:focus{ border-color:var(--accent); }
  .setup-card input[type=text]{
    width:100%; height:46px; border:1.5px solid var(--border); border-radius:999px;
    padding:0 16px; font-size:15px; outline:none; color:var(--text); background:var(--surface);
  }
  .setup-primary-btn{
    margin-top:14px; width:100%; height:46px; border:none; border-radius:999px;
    background:var(--accent); color:#fff; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .setup-primary-btn:disabled{ opacity:0.5; }
  .setup-error{ margin-top:10px; font-size:12.5px; color:#C0392B; }
  .setup-link{ color:var(--accent); text-decoration:underline; }
  .setup-secondary{
    margin-top:10px; width:100%; height:38px; border:none; background:none;
    color:var(--text-faint); font-size:12.5px; cursor:pointer; text-decoration:underline;
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function norm(s){ return (s||"").toLowerCase().trim(); }
  function todayLabel(){
    var d = new Date(); var days = ["일","월","화","수","목","금","토"];
    return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + days[d.getDay()] + ")";
  }

  /* ================= catalog search / add ================= */
  function searchCatalog(q){
    var nq = norm(q); if(!nq) return [];
    var liveNames = items.map(function(it){ return { ko: it.name, en: '', u: it.unit || '개' }; })
      .concat(pantryItems.map(function(it){ return { ko: it.name, en: '', u: it.unit || '개' }; }));
    var combined = CATALOG.concat(customCatalogItems).concat(liveNames);
    var seen = {};
    var out = [];
    combined.forEach(function(it){
      if(seen[it.ko]) return;
      if(norm(it.ko).indexOf(nq) !== -1 || norm(it.en).indexOf(nq) !== -1){
        seen[it.ko] = true;
        out.push(it);
      }
    });
    return out.slice(0, 24);
  }

  function renderCatalogPanel(){
    var q = catalogQuery.trim();
    el.clearCatalogBtn.style.display = q ? 'flex' : 'none';
    if(pendingAdd){ renderQtySheetOnly(); return; }
    if(!q){ el.catalogPanel.style.display = 'none'; el.catalogPanel.innerHTML = ''; return; }

    var results = searchCatalog(q);
    var currentNames = (activeTab === 'pantry' ? pantryItems : items).map(function(it){ return it.name; });
    var html = '<div class="catalog-list">';
    if(results.length === 0){
      html += '<div class="empty-search">일치하는 식재료가 없어요</div>';
    } else {
      results.forEach(function(it){
        var already = currentNames.indexOf(it.ko) !== -1;
        html += '<div class="catalog-row"><div class="names"><div class="name-ko">' + escapeHtml(it.ko) +
          (already ? '<span class="already-tag">담겨있음</span>' : '') + '</div>' +
          '<div class="name-en">' + escapeHtml(it.en) + '</div></div>' +

    fbStore.collection('customCatalog').doc(safeDocId(name)).set({ name:name, addedAt:Date.now() }, { merge:true })

  /* ================= firestore-backed data ops ================= */
  function addItemToList(name, qty, unit){
    if(!fbStore) return;
    fbStore.collection('items').add({ name:name, qty:qty, unit:unit, checked:false, addedAt:Date.now(), addedBy:userName })
      .then(function(){ logHistory('add', name); })
      .catch(function(e){ console.error('add failed', e); flashPill('추가 실패 — 연결을 확인해주세요'); });
  }
  function toggleItem(item){
    if(!fbStore) return;
    var next = !item.checked;
    fbStore.collection('items').doc(item.id).update({ checked: next })
      .then(function(){ logHistory(next ? 'check' : 'uncheck', item.name); })
      .catch(function(e){ console.error(e); });
  }
  function updateItemQty(item, qty, unit, name){
    if(!fbStore) return;
    var fields = { qty: qty, unit: unit };
    var newName = (name || '').trim();
    if(newName) fields.name = newName;
    fbStore.collection('items').doc(item.id).update(fields)
      .then(function(){ logHistory('edit', newName || item.name, null, qty, unit); })
      .catch(function(e){ console.error(e); flashPill('수정 실패 — 연결을 확인해주세요'); });
  }
  function deleteItem(item){
    if(!fbStore) return;
    fbStore.collection('items').doc(item.id).delete()
      .then(function(){ logHistory('delete', item.name); })
      .catch(function(e){ console.error(e); });
  }
  function clearList(){
    if(!fbStore) return;
    var toDelete = items.slice(); var count = toDelete.length;
    Promise.all(toDelete.map(function(it){ return fbStore.collection('items').doc(it.id).delete(); }))
      .then(function(){ logHistory('clear', null, count); flashPill('오늘 장보기 완료! 리스트를 비웠어요'); })
      .catch(function(e){ console.error('clear failed', e); });
  }
  function logHistory(type, itemName, count, qty, unit, target){
    if(!fbStore) return;
    fbStore.collection('history').add({ type:type, item:itemName||null, count:count||null, qty:(qty===undefined?null:qty), unit:unit||null, target:target||'shopping', who:userName, at:Date.now() })
      .catch(function(e){ console.error('history log failed', e); });
  }

      '<div class="item-qty">' + formatQty(item.qty) + item.unit +
      (tag ? ' <span class="loc-tag">' + escapeHtml(tag) + '</span>' : '') +
      '</div>' +
      (pantryMode && item.note ? '<div class="item-note">📝 ' + escapeHtml(item.note) + '</div>' : '') +
      '</div>';
    if(!pantryMode){
      html += '<button class="edit-btn" data-edit="' + item.id + '" aria-label="수정">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>';
    } else if(!selectionMode){
      html += '<button class="edit-btn" data-detail-btn="' + item.id + '" aria-label="수정">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>';

    }

  function groupedListHtml(sourceArray, opts){
    var groups = {};
    sourceArray.forEach(function(item){
      var key = opts.groupKeyFn(item);
      if(!groups[key]) groups[key] = [];
      groups[key].push(item);
    });
    var orderedKeys;
    if(opts.groupOrder){
      orderedKeys = opts.groupOrder.filter(function(c){ return groups[c] && groups[c].length; });
      Object.keys(groups).forEach(function(c){ if(orderedKeys.indexOf(c) === -1) orderedKeys.push(c); });
    } else {
      orderedKeys = Object.keys(groups).sort(function(a, b){
        if(a === UNSPECIFIED_LOCATION) return 1;
        if(b === UNSPECIFIED_LOCATION) return -1;
        return a.localeCompare(b, 'ko');
      });
    }
    var html = '';
    orderedKeys.forEach(function(key){
      html += '<div class="cat-label">' + escapeHtml(key) + '</div><div class="list-group">';
      groups[key].forEach(function(item){ html += itemRowHtml(item, opts); });
      html += '</div>';
    });
    return html;
  }

  var ignoreNextPointerUp = false;

  function attachLongPress(node, onLongPress, onTap){
    var timer = null, moved = false, sx = 0, sy = 0, fired = false;
    function clear(){ if(timer){ clearTimeout(timer); timer = null; } }
    function start(x, y){ moved = false; fired = false; sx = x; sy = y; clear();
      timer = setTimeout(function(){ fired = true; timer = null; onLongPress(); }, 480);
    }
    function move(x, y){ if(!timer) return; if(Math.abs(x-sx) > 10 || Math.abs(y-sy) > 10){ moved = true; clear(); } }
    function end(){
      clear();
      if(ignoreNextPointerUp){ ignoreNextPointerUp = false; return; }
      if(!fired && !moved) onTap();
    }
    node.addEventListener('pointerdown', function(e){ start(e.clientX, e.clientY); });
    node.addEventListener('pointermove', function(e){ move(e.clientX, e.clientY); });
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', clear);
    node.addEventListener('pointerleave', clear);
  }

  function wireItemEvents(sourceArray, opts){
    if(opts.toggleFn){
      el.main.querySelectorAll('[data-toggle]').forEach(function(node){
        node.addEventListener('click', function(){
          var item = sourceArray.find(function(i){ return i.id === node.getAttribute('data-toggle'); });
          if(item) opts.toggleFn(item);
        });
      });
    }
    el.main.querySelectorAll('[data-del]').forEach(function(node){
      node.addEventListener('click', function(e){
        e.stopPropagation();
        var item = sourceArray.find(function(i){ return i.id === node.getAttribute('data-del'); });
        if(item) opts.deleteFn(item);
      });
    });
    if(opts.pantryMode){
      el.main.querySelectorAll('[data-detail-btn]').forEach(function(node){
        node.addEventListener('click', function(e){
          e.stopPropagation();
          var item = sourceArray.find(function(i){ return i.id === node.getAttribute('data-detail-btn'); });
          if(item) openDetail(item);
        });
      });
      el.main.querySelectorAll('[data-select]').forEach(function(node){
        node.addEventListener('click', function(e){
          e.stopPropagation();
          toggleSelect(node.getAttribute('data-select'));
        });
      });
      el.main.querySelectorAll('[data-press]').forEach(function(node){
        var id = node.getAttribute('data-press');
        attachLongPress(node,
          function(){ if(!selectionMode){ ignoreNextPointerUp = true; enterSelectionMode(id); } },
          function(){
            if(selectionMode){ toggleSelect(id); return; }
            var item = sourceArray.find(function(i){ return i.id === id; });
            if(item) openDetail(item);
          }
        );
      });
      return;
    }
    el.main.querySelectorAll('[data-edit]').forEach(function(node){
      node.addEventListener('click', function(e){
        e.stopPropagation();
        var id = node.getAttribute('data-edit');
        if(editingItemId === id){ editingItemId = null; renderMain(); return; }
        var item = sourceArray.find(function(i){ return i.id === id; });
        if(!item) return;
        editingItemId = id; editQty = item.qty; editUnit = item.unit; editName = item.name;
        renderMain();
      });
    });
    var editPanel = document.querySelector('[data-edit-panel]');
    if(editPanel){
      var editQtyInput = document.getElementById('editQtyInput');
      var editNameInput = document.getElementById('editNameInput');
      if(editNameInput){
        editNameInput.addEventListener('click', function(e){ e.stopPropagation(); });
        editNameInput.addEventListener('input', function(){ editName = editNameInput.value; });
      }
      document.getElementById('editQtyMinus').addEventListener('click', function(){
        var v = Math.max(0, (parseFloat(editQtyInput.value)||0) - 1); editQtyInput.value = v; editQty = v;
      });
      document.getElementById('editQtyPlus').addEventListener('click', function(){
        var v = (parseFloat(editQtyInput.value)||0) + 1; editQtyInput.value = v; editQty = v;
      });
      editQtyInput.addEventListener('click', function(e){ e.stopPropagation(); });
      editQtyInput.addEventListener('input', function(){ editQty = parseFloat(editQtyInput.value)||0; });
      document.getElementById('editUnitChips').querySelectorAll('.unit-chip').forEach(function(chip){
        chip.addEventListener('click', function(e){
          e.stopPropagation();
          editUnit = chip.getAttribute('data-unit');
          document.getElementById('editUnitChips').querySelectorAll('.unit-chip').forEach(function(c){ c.classList.remove('sel'); });
          chip.classList.add('sel');
        });
      });
      document.getElementById('editCancelBtn').addEventListener('click', function(e){
        e.stopPropagation(); editingItemId = null; renderMain();
      });
      document.getElementById('editSaveBtn').addEventListener('click', function(e){
        e.stopPropagation();
        var item = sourceArray.find(function(i){ return i.id === editingItemId; });
        var qty = editQty > 0 ? editQty : 1;
        if(item) opts.updateFn(item, qty, editUnit, editName.trim());
        editingItemId = null;
        renderMain();
      });
      editPanel.addEventListener('click', function(e){ e.stopPropagation(); });
    }
  }

  /* ---- multi-select (long-press) for pantry ---- */
  function enterSelectionMode(id){ selectionMode = true; selectedIds = {}; selectedIds[id] = true; renderMain(); }
  function toggleSelect(id){
    if(selectedIds[id]) delete selectedIds[id]; else selectedIds[id] = true;
    if(Object.keys(selectedIds).length === 0) selectionMode = false;
    renderMain();
  }
  function exitSelectionMode(){ selectionMode = false; selectedIds = {}; renderMain(); }

    var n = Object.keys(selectedIds).length;
    if(activeTab === 'pantry' && selectionMode && n > 0){
      el.selectionBar.classList.add('show');
      el.selectionCount.textContent = n + '개 선택됨';

      el.selectionBar.classList.remove('show');
    }

      '<div class="summary-text">' + pct + '%</div></div>' +
      '<div class="summary-copy"><div class="headline">' + doneCount + ' / ' + items.length + ' 완료</div>' +

      html += '<div class="confirm-clear"><span>리스트를 전부 비울까요?</span>' +

        '<button class="yes-btn" id="clearYesBtn">비우기</button></div>';

  function applyBulkEdit(field, value){
    if(!fbStore) return;

    var batch = fbStore.batch();

    ids.forEach(function(id){ batch.update(fbStore.collection('pantry').doc(id), fields); });
    batch.commit().then(function(){
      fbStore.collection('history').add({
        type:'bulk', item:null, count:ids.length, field:field, value:value,
        target:'pantry', who:userName, at:Date.now()
      }).catch(function(){});
      flashPill(ids.length + '개 ' + (field==='category' ? '카테고리' : '위치') + ' 변경됨');
    }).catch(function(e){ console.error('bulk edit failed', e); flashPill('일괄 변경 실패 — 연결을 확인해주세요'); });

  function resizeImageFile(file, maxDim, quality, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        try{ cb(canvas.toDataURL('image/jpeg', quality)); }catch(err){ cb(null); }
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  function relTime(ts){
    var diff = Date.now() - ts, m = Math.floor(diff/60000);
    if(m < 1) return '방금 전';
    if(m < 60) return m + '분 전';
    var hr = Math.floor(m/60);
    if(hr < 24) return hr + '시간 전';
    return Math.floor(hr/24) + '일 전';
  }
  function actionText(h){

      case 'check': return escapeHtml(h.item) + ' 체크함';
      case 'uncheck': return escapeHtml(h.item) + ' 체크 해제함';
      case 'delete': return prefix + escapeHtml(h.item) + ' 삭제함';
      case 'edit': return prefix + escapeHtml(h.item) + '을(를) ' + formatQty(h.qty) + (h.unit||'') + '(으)로 수정함';
      case 'bulk': return prefix + (h.count||0) + '개 항목의 ' + (h.field==='category'?'카테고리':'위치') + '를 "' + escapeHtml(h.value||'') + '"로 일괄 변경함';

  function parseFirebaseConfigText(text){

    if(!obj || !obj.apiKey || !obj.projectId) throw new Error('missing-fields');
    return obj;
  }

  function startApp(){
    hideSetup();
    el.historyBtn.style.display = 'flex';
    maybeShowIosHint();
    if(!window.firebase){
      loadScript(FB_APP_URL).then(function(){ return loadScript(FB_FIRESTORE_URL); }).then(initFirebase).catch(function(){
        flashPill('Firebase 라이브러리를 불러오지 못했어요');
      });
    } else {
      initFirebase();
    }
  }

  function initFirebase(){
    try{
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(fbConfig); }
      fbStore = firebase.firestore();
    }catch(e){
      console.error(e);
      localStorage.removeItem(LS_CONFIG_KEY);
      fbConfig = null;
      showConfigSetup('연결에 실패했어요. 설정 내용을 다시 확인해주세요.');
      return;
    }
    subscribeItems();
    subscribePantry();
    subscribeCustomCatalog();
    subscribeHistory();
    seedIfNeeded();
  }

  function boot(){
    var savedConfig = localStorage.getItem(LS_CONFIG_KEY);
    var savedName = localStorage.getItem(LS_NAME_KEY);
    if(!savedConfig){ showConfigSetup(); return; }
    try{ fbConfig = JSON.parse(savedConfig); }catch(e){ localStorage.removeItem(LS_CONFIG_KEY); showConfigSetup(); return; }
    if(!savedName){ showNameSetup(); return; }
    userName = savedName;
    startApp();
  }

  renderCatalogPanel();
  renderMain();
  boot();

})();
</script>
</body>
</html>
